<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  body { background: #f0f2f5; height: 100vh; overflow: hidden; }

  /* ---------- LOGIN SCREEN ---------- */
  #auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: linear-gradient(135deg, #6a5cff, #4f8cff);
  }
  .auth-box {
    background: white;
    width: 100%;
    max-width: 360px;
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .auth-box h1 { text-align: center; font-size: 22px; color: #333; margin-bottom: 4px; }
  .auth-box p.sub { text-align: center; font-size: 13px; color: #888; margin-bottom: 20px; }
  .auth-box input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .auth-box button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }
  #login-btn { background: #4f8cff; color: white; }
  #signup-btn { background: #eef1f5; color: #333; }
  #auth-error { color: #e0245e; font-size: 13px; text-align: center; min-height: 18px; margin-bottom: 6px; }
  #auth-loading { text-align: center; font-size: 13px; color: #888; }

  /* ---------- CHAT SCREEN (Messenger style) ---------- */
  #app-screen { display: none; height: 100vh; }
  .layout { display: flex; height: 100%; }

  .sidebar {
    width: 300px;
    background: white;
    border-right: 1px solid #e4e6eb;
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #eee;
  }
  .sidebar-header h2 { font-size: 18px; color: #050505; }
  .me-info { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4f8cff, #6a5cff);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
  }
  .me-info .name { font-size: 14px; font-weight: 600; color: #050505; }
  .me-info .email { font-size: 12px; color: #888; }
  #logout-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: #4f8cff;
    font-size: 12px;
    cursor: pointer;
  }
  .conversation-item {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #e7f0ff;
    border-left: 3px solid #4f8cff;
  }
  .conversation-item .conv-name { font-size: 14px; font-weight: 600; }
  .conversation-item .conv-sub { font-size: 12px; color: #888; }
  .online-list {
    padding: 12px 16px;
    font-size: 12px;
    color: #999;
    border-top: 1px solid #eee;
    margin-top: auto;
    max-height: 140px;
    overflow-y: auto;
  }
  .online-user { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; color: #333; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #31a24c; }

  .chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; }
  .chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-header .title { font-size: 16px; font-weight: 600; color: #050505; }
  .chat-header .status { font-size: 12px; color: #31a24c; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: #fff;
  }
  .msg-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 6px; }
  .msg-row.me { justify-content: flex-end; }
  .msg-row .mini-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: #ccd0d5; color: #555;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .bubble {
    max-width: 65%;
    padding: 9px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg-row.other .bubble { background: #e9eaee; color: #050505; }
  .msg-row.me .bubble { background: #4f8cff; color: white; }
  .msg-meta {
    font-size: 10px;
    color: #999;
    margin: 0 40px 8px;
  }
  .msg-row.me + .msg-meta { text-align: right; }
  .sender-label { font-size: 11px; color: #888; margin: 6px 0 2px 34px; }

  #chat-form {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid #eee;
  }
  #chat-form input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 22px;
    font-size: 14px;
    outline: none;
  }
  #chat-form button {
    background: #4f8cff;
    color: white;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  @media (max-width: 700px) {
    .sidebar { width: 90px; }
    .me-info .name, .me-info .email, .conv-name, .conv-sub { display: none; }
    .online-list { display: none; }
  }
</style>
</head>
<body>

<!-- ============ MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ ============ -->
<div id="auth-screen">
  <div class="auth-box">
    <h1>💬 ChatApp</h1>
    <p class="sub">Đăng nhập bằng email để bắt đầu chat</p>
    <input type="text" id="display-name" placeholder="Tên hiển thị (chỉ cần khi đăng ký)">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)">
    <div id="auth-error"></div>
    <button id="login-btn">Đăng nhập</button>
    <button id="signup-btn">Tạo tài khoản mới</button>
    <div id="auth-loading"></div>
  </div>
</div>

<!-- ============ MÀN HÌNH CHAT (kiểu Messenger) ============ -->
<div id="app-screen">
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Đoạn chat</h2>
      </div>
      <div class="me-info">
        <div class="avatar" id="my-avatar">?</div>
        <div>
          <div class="name" id="my-name">—</div>
          <div class="email" id="my-email">—</div>
        </div>
        <button id="logout-btn">Đăng xuất</button>
      </div>
      <div class="conversation-item">
        <div class="avatar">🌐</div>
        <div>
          <div class="conv-name">Phòng chat chung</div>
          <div class="conv-sub">Mọi người cùng chat ở đây</div>
        </div>
      </div>
      <div class="online-list">
        <div style="font-weight:600; margin-bottom:6px;">Đang hoạt động</div>
        <div id="online-users"></div>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-header">
        <div class="avatar">🌐</div>
        <div>
          <div class="title">Phòng chat chung</div>
          <div class="status" id="user-count">—</div>
        </div>
      </div>
      <div id="messages"></div>
      <form id="chat-form">
        <input type="text" id="msg-input" placeholder="Aa" autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </div>
  </div>
</div>

<script>
/* =========================================================
   1) DÁN CONFIG FIREBASE CỦA BẠN VÀO ĐÂY
   Lấy ở: Firebase Console > Project Settings > Your apps > Web app
========================================================= */
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};
/* ========================================================= */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const authScreen = document.getElementById("auth-screen");
const appScreen = document.getElementById("app-screen");
const authError = document.getElementById("auth-loading") ? document.getElementById("auth-error") : null;
const authLoading = document.getElementById("auth-loading");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const displayNameInput = document.getElementById("display-name");
const loginBtn = document.getElementById("login-btn");
const signupBtn = document.getElementById("signup-btn");
const logoutBtn = document.getElementById("logout-btn");

function showAuthError(msg) {
  document.getElementById("auth-error").textContent = msg;
}
function setLoading(on) {
  authLoading.textContent = on ? "Đang xử lý..." : "";
}

loginBtn.addEventListener("click", async () => {
  showAuthError("");
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  if (!email || !password) return showAuthError("Nhập email và mật khẩu.");
  setLoading(true);
  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (e) {
    showAuthError(translateError(e.code));
  }
  setLoading(false);
});

signupBtn.addEventListener("click", async () => {
  showAuthError("");
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const name = displayNameInput.value.trim() || email.split("@")[0];
  if (!email || !password) return showAuthError("Nhập email và mật khẩu.");
  if (password.length < 6) return showAuthError("Mật khẩu cần tối thiểu 6 ký tự.");
  setLoading(true);
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });
    await db.collection("users").doc(cred.user.uid).set({
      name: name,
      email: email,
      lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {
    showAuthError(translateError(e.code));
  }
  setLoading(false);
});

logoutBtn.addEventListener("click", () => auth.signOut());

function translateError(code) {
  const map = {
    "auth/email-already-in-use": "Email này đã được đăng ký.",
    "auth/invalid-email": "Email không hợp lệ.",
    "auth/weak-password": "Mật khẩu quá yếu (tối thiểu 6 ký tự).",
    "auth/user-not-found": "Tài khoản không tồn tại.",
    "auth/wrong-password": "Sai mật khẩu.",
    "auth/invalid-credential": "Email hoặc mật khẩu không đúng."
  };
  return map[code] || ("Lỗi: " + code);
}

/* ---------- Theo dõi trạng thái đăng nhập ---------- */
let currentUser = null;
let unsubscribeMessages = null;

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    authScreen.style.display = "none";
    appScreen.style.display = "block";

    const name = user.displayName || user.email.split("@")[0];
    document.getElementById("my-name").textContent = name;
    document.getElementById("my-email").textContent = user.email;
    document.getElementById("my-avatar").textContent = name.charAt(0).toUpperCase();

    // cập nhật trạng thái online
    await db.collection("users").doc(user.uid).set({
      name: name,
      email: user.email,
      lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    listenOnlineUsers();
    listenMessages();
  } else {
    currentUser = null;
    if (unsubscribeMessages) unsubscribeMessages();
    appScreen.style.display = "none";
    authScreen.style.display = "flex";
    emailInput.value = "";
    passwordInput.value = "";
  }
});

/* ---------- Danh sách người đang hoạt động (đã online trong 2 phút gần đây) ---------- */
function listenOnlineUsers() {
  db.collection("users").onSnapshot((snap) => {
    const now = Date.now();
    let count = 0;
    const container = document.getElementById("online-users");
    container.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      const lastSeen = d.lastSeen ? d.lastSeen.toMillis() : 0;
      if (now - lastSeen < 2 * 60 * 1000) {
        count++;
        const div = document.createElement("div");
        div.className = "online-user";
        div.innerHTML = `<span class="dot"></span> ${escapeHtml(d.name || d.email)}`;
        container.appendChild(div);
      }
    });
    document.getElementById("user-count").textContent = count + " người đang hoạt động";
  });
  // heartbeat: cập nhật lastSeen mỗi 60 giây
  setInterval(() => {
    if (currentUser) {
      db.collection("users").doc(currentUser.uid).set({
        lastSeen: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }
  }, 60000);
}

/* ---------- Realtime tin nhắn (phòng chat chung) ---------- */
function listenMessages() {
  const messagesEl = document.getElementById("messages");
  unsubscribeMessages = db.collection("messages")
    .orderBy("createdAt", "asc")
    .limitToLast(200)
    .onSnapshot((snap) => {
      messagesEl.innerHTML = "";
      snap.forEach(doc => {
        const m = doc.data();
        renderMessage(m);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
}

function renderMessage(m) {
  const messagesEl = document.getElementById("messages");
  const isMe = currentUser && m.uid === currentUser.uid;
  const time = m.createdAt ? m.createdAt.toDate().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) : "";

  if (!isMe) {
    const label = document.createElement("div");
    label.className = "sender-label";
    label.textContent = m.name || m.email || "Ẩn danh";
    messagesEl.appendChild(label);
  }

  const row = document.createElement("div");
  row.className = "msg-row " + (isMe ? "me" : "other");

  if (!isMe) {
    const mini = document.createElement("div");
    mini.className = "mini-avatar";
    mini.textContent = (m.name || m.email || "?").charAt(0).toUpperCase();
    row.appendChild(mini);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = m.text;
  row.appendChild(bubble);

  messagesEl.appendChild(row);

  const meta = document.createElement("div");
  meta.className = "msg-meta";
  meta.textContent = time;
  meta.style.textAlign = isMe ? "right" : "left";
  meta.style.marginLeft = isMe ? "0" : "40px";
  messagesEl.appendChild(meta);
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

/* ---------- Gửi tin nhắn ---------- */
document.getElementById("chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || !currentUser) return;
  input.value = "";
  await db.collection("messages").add({
    text: text,
    uid: currentUser.uid,
    name: currentUser.displayName || currentUser.email.split("@")[0],
    email: currentUser.email,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
});
</script>

</body>
</html>
