// ============================================================================
// 2. CƠ CHẾ TÍNH ĐIỂM ELO (BOT THEO CẤP ĐỘ & NGƯỜI CHƠI ONLINE)
// ============================================================================
const BOT_ELO_TABLE = {
  easy:   { win: +8,  draw: -2,  loss: -15, label: "Bot Khởi đầu (Skill 1)",   botElo: 800  },
  medium: { win: +15, draw: +2,  loss: -12, label: "Bot Thử thách (Skill 7)",  botElo: 1200 },
  hard:   { win: +28, draw: +6,  loss: -8,  label: "Bot Cao thủ (Skill 14)",   botElo: 1650 },
  hell:   { win: +55, draw: +15, loss: -5,  label: "Bot Địa ngục (Elo ~3000+)", botElo: 3000 }
};

function calcPvpEloDelta(myElo, oppElo, score) {
  const K = 32;
  const expected = 1 / (1 + Math.pow(10, (oppElo - myElo) / 400));
  let delta = Math.round(K * (score - expected));
  if(score === 1 && delta < 5) delta = 5;
  if(score === 0 && delta > -5) delta = -5;
  return delta;
}

// ============================================================================
// 3. TÍCH HỢP CELESTIAL UCI ENGINE
// ============================================================================
let game=new Chess(), selected=null, flipped=false, mode="easy", human="w";

// === AUDIO SYSTEM (Web Audio API) ===
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playSound(type = "move") {
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (type === "move") {
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(320, now + 0.08);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === "capture") {
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.start(now); osc.stop(now + 0.18);
  } else if (type === "check") {
    osc.frequency.setValueAtTime(660, now);
    osc.frequency.setValueAtTime(880, now + 0.06);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.start(now); osc.stop(now + 0.12);
  } else if (type === "end") {
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.exponentialRampToValueAtTime(220, now + 0.3);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.start(now); osc.stop(now + 0.35);
  }
}

// === SMOOTH MOVE ANIMATION ===
let animating = null; // {from, to, piece, start, duration}
const ANIM_DURATION = 220; // ms
function startMoveAnimation(from, to, piece) {
  // Disabled on mobile/Android to prevent green flashing
  // animating = { from, to, piece, start: performance.now(), duration: ANIM_DURATION };
  // requestAnimationFrame(animateFrame);
  animating = null;
}
function animateFrame() {
  // Disabled completely to prevent green flash on Android
  animating = null;
}

let positionHistory = new Map();
function getPositionKey() {
  const parts = game.fen().split(" ");
  return parts.slice(0, 4).join(" ");
}
function checkCustomRepetition() {
  const key = getPositionKey();
  const count = (positionHistory.get(key) || 0) + 1;
  positionHistory.set(key, count);
  return count >= 3;
}
let engine=null, engineReady=false, engineBusy=false, engineMode="play";
let roomId=null, isOnlineGame=false, onlineRoomData=null, matchRecorded=false;
// ============================================================================
// PERSISTENCE (localStorage) + LỊCH SỬ VÁN CỜ — reset/thoát trang vẫn giữ bàn cờ
// ============================================================================
const LS_CURRENT="chess_current_v1", LS_HISTORY="chess_history_v1";
let currentGameId=null, historyArchived=false, historyView=null, restoredUnfinished=false;
function loadLS(k,fb){ try{ const v=JSON.parse(localStorage.getItem(k)); return v??fb; }catch(e){ return fb; } }
function saveLS(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function gameSnapshot(over){
  let moves=[]; try{ moves=game.history({verbose:true}).map(m=>m.san); }catch(e){}
  return { id: currentGameId || ("g_"+Date.now()), savedAt: Date.now(),
    mode, modeLabel: isOnlineGame ? "PvP Online" : ("Đấu máy · "+(modeNames[mode]||mode)),
    human, flipped, clockSeconds, remaining:{...remaining}, isOnlineGame, roomId,
    fen: game.fen(), pgn: game.pgn(), moves, over: !!over, gameOver: game.game_over() };
}
function saveCurrent(){
  if(reviewMode || historyView) return;
  if(!currentGameId) currentGameId="g_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
  const snap=gameSnapshot(false);
  // Đừng ghi đè ván đã kết thúc bằng trạng thái đang xem lại / đã xong mà chưa lưu lịch sử
  saveLS(LS_CURRENT, snap);
}
function getHistory(){ const h=loadLS(LS_HISTORY,[]); return Array.isArray(h)?h:[]; }
function archiveFinishedGame(result, reason){
  if(historyArchived || !currentGameId) return;
  historyArchived=true;
  const snap=gameSnapshot(true);
  snap.result=result; snap.reason=reason; snap.finishedAt=Date.now();
  const h=getHistory().filter(x=>x.id!==snap.id);
  h.unshift(snap); saveLS(LS_HISTORY, h.slice(0,50));
  renderHistoryList();
}
function restoreCurrentGame(silent){
  const s=loadLS(LS_CURRENT,null); if(!s || !s.fen) return false;
  try{ game.load(s.fen); }catch(e){ return false; }
  currentGameId=s.id; mode=s.mode||mode; human=s.human||"w"; flipped=!!s.flipped;
  clockSeconds=s.clockSeconds||0; remaining=s.remaining||{w:clockSeconds,b:clockSeconds};
  isOnlineGame=!!s.isOnlineGame; roomId=s.roomId||null; matchRecorded=!!s.over; historyArchived=!!s.over;
  // Rebuild repetition map từ lịch sử nước đi
  positionHistory=new Map(); { const tg=new Chess(); positionHistory.set(tg.fen().split(" ").slice(0,4).join(" "),1);
    for(const san of (s.moves||[])){ try{ tg.move(san); const k=tg.fen().split(" ").slice(0,4).join(" "); positionHistory.set(k,(positionHistory.get(k)||0)+1); }catch(e){} } }
  $("gameTitle").textContent = isOnlineGame ? ("Phòng Online: "+(roomId||"")) : (\`\${modeNames[mode]} · Celestial Bot\`);
  $("topName").textContent = isOnlineGame ? "Đối thủ Online" : (human==="w" ? \`Celestial (\${modeNames[mode]}) · Đen\` : \`Celestial (\${modeNames[mode]}) · Trắng\`);
  $("bottomName").textContent = user ? (user.displayName||user.email) : "Bạn";
  if(!s.over && !isOnlineGame){ restoredUnfinished=true; if(!silent){ const b=$("resumeBanner"); if(b) b.classList.add("show"); } }
  if(!s.over && !isOnlineGame && clockSeconds) startClock();
  return true;
}
function renderHistoryList(){
  const el=$("historyList"); if(!el) return;
  const h=getHistory();
  $("histCountTag").textContent=h.length+" ván";
  if(!h.length){ el.innerHTML='<p class="notice">Chưa có ván nào kết thúc. Ván đang chơi được tự động lưu ở trên.</p>'; return; }
  el.innerHTML="";
  h.forEach(item=>{
    const d=new Date(item.finishedAt||item.savedAt||Date.now());
    const res = item.result==="win" ? "🏆 Thắng" : item.result==="loss" ? "❌ Thua" : item.result==="draw" ? "🤝 Hoà" : "⏹ Kết thúc";
    const div=document.createElement("div"); div.className="hist-item";
    div.innerHTML=\`<b>\${res} · \${escapeHtml(item.modeLabel||"")}</b><div class="hist-meta">\${d.toLocaleString("vi-VN")} · \${item.moves?item.moves.length:0} nước · \${escapeHtml(item.reason||"")}</div><div class="hist-moves">\${escapeHtml((item.moves||[]).join(" "))||"—"}</div><div class="hist-actions"><button class="primary" data-view="1">▶ Xem lại từng nước</button><button data-copy="1">📋 Copy PGN</button><button class="danger" data-del="1">Xoá</button></div>\`;
    div.querySelector("[data-view]").onclick=(e)=>{ e.stopPropagation(); openHistoryGame(item.id); };
    div.querySelector("[data-copy]").onclick=(e)=>{ e.stopPropagation(); navigator.clipboard?.writeText(item.pgn||"").then(()=>alert("Đã copy PGN!")); };

const CELESTIAL_CDN = "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js";
const DIFFICULTY = {
  // Thời gian được giữ ngắn; tăng skill/depth để cải thiện chất lượng thay vì bắt người chơi chờ lâu.
  easy:   { skill: 4,  depth: 5,  movetime: 55  },
  medium: { skill: 9,  depth: 9,  movetime: 115 },
  hard:   { skill: 16, depth: 13, movetime: 230 },
  hell:   { skill: 20, depth: 0,  movetime: 950 }
};

let engineKind = "sf10", botWatch = null, earlyStop = null;
let reviewMode = false, reviewData = null, reviewPly = 0, reviewJob = null, reviewFull = null, swallowBest = false;

function armBotWatch(ms){
  clearTimeout(botWatch);
  botWatch = setTimeout(() => {
    if(!engineBusy || engineMode !== "play") return;
    if(engine) engine.postMessage("stop");
    botWatch = setTimeout(() => {
      if(!engineBusy || engineMode !== "play") return;
      engineBusy = false;
      if(engineKind === "sf19") useCdnEngine();
      fallbackMove();
    }, 2500);
  }, ms);
}
const LOCAL_SF = "stockfish-19-lite-single.js";

async function makeWorker(forceCdn){
  if(!forceCdn){
    try {
      const head = await fetch(LOCAL_SF, { method: "HEAD", cache: "no-store" });
      if(head.ok && /javascript/.test(head.headers.get("content-type") || "")){
        engineKind = "sf19";
        return new Worker(LOCAL_SF);
      }
    } catch {}
  }
  engineKind = "sf10";
  const res = await fetch(CELESTIAL_CDN);
  const scriptText = await res.text();
  const blob = new Blob([scriptText], { type: "application/javascript" });
  return new Worker(URL.createObjectURL(blob));
}

function useCdnEngine(){
  engineKind = "sf10";
  if(engine) engine.terminate();
  engine = null; engineReady = false; engineBusy = false;
  initEngine(true);
}

async function initEngine(forceCdn){
  try {
    engine = await makeWorker(forceCdn);
    engine.onerror = () => { if(engineKind === "sf19" && !engineReady) useCdnEngine(); };

    engine.onmessage = e => {
      const line = String(e.data || "").trim();
      if(swallowBest && line.startsWith("bestmove")){ swallowBest = false; return; }
      if(reviewJob){ reviewLine(line); return; }
      if(line === "uciok") engine.postMessage("isready");
      if(line === "readyok") {
        engineReady = true;
        $("engineBadge").textContent = "⚡ Celestial Ready · " + (engineKind === "sf19" ? "SF19" : "SF10");
        $("engineBadge").classList.add("ready");
      }
      if(earlyStop && engineMode === "play" && line.startsWith("info ")) trackEarlyStop(line);
      if(line.startsWith("info ") && line.includes(" score ") && isAdminUser() && engineMode === "eval") {
        const mateMatch = line.match(/score mate (-?\\d+)/);
        const cpMatch = line.match(/score cp (-?\\d+)/);
        const pvMatch = line.match(/ pv ([a-h][1-8][a-h][1-8][qrbn]?)/);
        let evalStr = "";
        if(mateMatch) evalStr = \`Chiếu hết sau \${Math.abs(Number(mateMatch[1]))} nước\`;
        else if(cpMatch) {
          const score = (Number(cpMatch[1]) / 100 * (game.turn()==="w"?1:-1)).toFixed(2);
          evalStr = \`Đánh giá: \${score > 0 ? "+"+score : score}\`;
        }
        if(evalStr && pvMatch) {
          const dM = line.match(/ depth (\\d+)/), nM = line.match(/ nps (\\d+)/);
          const perf = dM ? \` · d\${dM[1]}\${nM ? " · " + Math.round(Number(nM[1])/1000) + "k nps" : ""}\` : "";
          $("analysisText").textContent = \`\${evalStr} · Nước tối ưu: \${pvMatch[1]}\${perf}\`;
        }
      }
      if(line.startsWith("bestmove")) {
        const uci = line.split(" ")[1];
        clearTimeout(botWatch);
        earlyStop = null;
        engineBusy = false;
        if(!uci || uci === "(none)") return;

        if(engineMode === "hint") {
          if(isAdminUser()) {
            hintArrow = { from: uci.slice(0,2), to: uci.slice(2,4) };
            $("analysisText").textContent = \`✨ Celestial gợi ý nước đi: \${hintArrow.from} → \${hintArrow.to}\`;
          }
          engineMode = "play";
          const cfg = DIFFICULTY[mode] || DIFFICULTY.easy;
          engine.postMessage(\`setoption name Skill Level value \${cfg.skill}\`);
          render();
          return;
        }
        if(engineMode === "eval") {
          if(isAdminUser()) {
            hintArrow = { from: uci.slice(0,2), to: uci.slice(2,4) };
            $("analysisText").textContent += \` | Khuyên đi: \${uci}\`;
          }
          engineMode = "play";
          const cfg = DIFFICULTY[mode] || DIFFICULTY.easy;
          engine.postMessage(\`setoption name Skill Level value \${cfg.skill}\`);
          render();
          return;
        }

        const moveObj = { from: uci.slice(0,2), to: uci.slice(2,4), promotion: uci[4] || "q" };
        try {
          const movingPiece = game.get(moveObj.from);
          game.move(moveObj);
          if (checkCustomRepetition()) {
            checkGameOver(null, "Hoà cờ (Lặp lại 3 lần)");
            return;
          }
          hintArrow = null;
          const isCapture = !!game.history({verbose:true}).slice(-1)[0]?.captured;
          const isCheck = game.in_check();
          playSound(isCapture ? "capture" : (isCheck ? "check" : "move"));
          if (movingPiece) startMoveAnimation(moveObj.from, moveObj.to, movingPiece);
          // startMoveAnimation is intentionally disabled on mobile; render must still run.
          render();
          checkGameOver();
        } catch {
          fallbackMove();
        }
      }
    };
    engine.postMessage("uci");
    if(engineKind === "sf19") setTimeout(() => { if(engineKind === "sf19" && !engineReady) useCdnEngine(); }, 12000);
  } catch(err) {
    console.warn("Không thể tải Celestial CDN:", err);
  }
}

async function handleSignIn(email, pass, msgEl) {
  if(!fbReady) return alert("Chưa kết nối Firebase!");
  if(!email || !pass) {
    const m = "Vui lòng nhập email và mật khẩu.";
    if(msgEl) { msgEl.style.display="flex"; msgEl.textContent = m; } else alert(m);
    return;
  }
  try {
    await signInWithEmailAndPassword(auth, email.trim(), pass);
  } catch(e) {
    let m = "Đăng nhập thất bại.";
    if(e.code === "auth/invalid-credential" || e.code === "auth/wrong-password" || e.code === "auth/user-not-found") {
      m = "Email hoặc mật khẩu không đúng. Nếu chưa có tài khoản, hãy nhấn Đăng ký.";
    } else if(e.code === "auth/invalid-email") {
      m = "Email không hợp lệ.";
    } else if(e.code === "auth/too-many-requests") {
      m = "Thử quá nhiều lần. Vui lòng đợi một lúc rồi thử lại.";
    } else {
      m = "Lỗi: " + (e.message || e.code || "Không xác định");
    }
    if(msgEl) { msgEl.style.display="flex"; msgEl.textContent = m; }
    else alert(m);
  }
}

async function handleSignUp(name, email, pass, msgEl) {
  if(!fbReady) return alert("Chưa kết nối Firebase!");
  try {
    const c = await createUserWithEmailAndPassword(auth, email.trim(), pass);
    const cleanName = (name || email.split("@")[0]).trim();
    await updateProfile(c.user, { displayName: cleanName });
    await set(ref(db, \`users/\${c.user.uid}/profile\`), {
      name: cleanName,
      email: c.user.email,
      elo: 1000,
      games: 0,
      wins: 0,
      draws: 0,
      losses: 0,
      createdAt: serverTimestamp(),
      lastSeen: serverTimestamp()
    });
    renderUser();
  } catch(e) {
    let m = "Đăng ký thất bại.";
    if(e.code === "auth/email-already-in-use") {
      m = "Email này đã được đăng ký. Hãy dùng Đăng nhập.";
    } else if(e.code === "auth/weak-password") {
      m = "Mật khẩu quá yếu (tối thiểu 6 ký tự).";
    } else if(e.code === "auth/invalid-email") {
      m = "Email không hợp lệ.";
    } else {
      m = "Lỗi: " + (e.message || e.code || "Không xác định");
    }
    if(msgEl) { msgEl.style.display="flex"; msgEl.textContent = m; }
    else alert(m);
  }
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, s => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s]));
}

const canvas = $("boardCanvas");
const ctx = canvas.getContext("2d");
let lastGlowKey = "", moveGlowStart = 0, glowRaf = null;
const spriteCache = {};

function pieceSprite(color, type, size){
  const key = color + type + size;
  if (spriteCache[key]) return spriteCache[key];
  const white = color === "w", ch = glyph.b[type] + "\\uFE0E";
  const font = \`\${Math.floor(size * 0.82)}px "Noto Sans Symbols 2","Segoe UI Symbol","Apple Symbols","DejaVu Sans",serif\`;
  const cx = size / 2, cy = size * 0.54;
  const mk = () => { const c = document.createElement("canvas"); c.width = c.height = size; const g = c.getContext("2d"); g.font = font; g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round"; return [c, g]; };
  const [body, b] = mk();
  const gr = b.createLinearGradient(0, size * 0.1, 0, size * 0.92);
  if (white) { gr.addColorStop(0, "#fffdf4"); gr.addColorStop(0.55, "#f1e3c0"); gr.addColorStop(1, "#c9b383"); }
  else { gr.addColorStop(0, "#5c6579"); gr.addColorStop(0.5, "#262b36"); gr.addColorStop(1, "#080a0e"); }
  b.fillStyle = gr; b.fillText(ch, cx, cy);
  // Removed source-atop highlight (caused green flash on Android)
  // b.globalCompositeOperation = "source-atop";
  // ... highlight removed
  const [spr, g] = mk();
  g.lineWidth = size * 0.08; g.strokeStyle = white ? "#2a190b" : "#f6e2a2"; g.strokeText(ch, cx, cy);
  g.drawImage(body, 0, 0);
  g.lineWidth = size * 0.02; g.strokeStyle = white ? "#7a5a2c" : "#e0b84e"; g.strokeText(ch, cx, cy);
  return (spriteCache[key] = spr);
}

function squareToGrid(sq) {
  const f = "abcdefgh".indexOf(sq[0]);
  const r = Number(sq[1]) - 1;
  const col = flipped ? 7 - f : f;
  const row = flipped ? r : 7 - r;
  return { col, row };
}

function drawArrow(fromSq, toSq) {
  const p1 = squareToGrid(fromSq);
  const p2 = squareToGrid(toSq);
  const size = canvas.width / 8;
  const x1 = (p1.col + 0.5) * size;
  const y1 = (p1.row + 0.5) * size;
  const x2 = (p2.col + 0.5) * size;
  const y2 = (p2.row + 0.5) * size;
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const headLen = size * 0.28;

  ctx.save();
  ctx.strokeStyle = "rgba(216, 181, 109, 0.88)";
  ctx.fillStyle = "rgba(216, 181, 109, 0.88)";
  ctx.lineWidth = size * 0.12;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - headLen * 0.6 * Math.cos(angle), y2 - headLen * 0.6 * Math.sin(angle));
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBoardCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const displaySize = Math.max(280, Math.floor(rect.width || 640));
  if (canvas.width !== displaySize * dpr) {
    canvas.width = displaySize * dpr;
    canvas.height = displaySize * dpr;
  }
  const sqSize = canvas.width / 8;
  const b = game.board();
  const files = flipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
  const ranks = flipped ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
  const legal = selected ? game.moves({square: selected, verbose: true}) : [];
  const lastMove = game.history({verbose: true}).slice(-1)[0];

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const nowT = performance.now();
  const mvKey = lastMove ? game.history().length + lastMove.from + lastMove.to : "";
  if (mvKey !== lastGlowKey) { lastGlowKey = mvKey; moveGlowStart = nowT; }
  const gAge = nowT - moveGlowStart, gK = Math.max(0, 1 - gAge / 2200), gPulse = 0.5 + 0.5 * Math.sin(gAge / 120);
  const rvm = (reviewMode && reviewPly > 0 && reviewData) ? reviewData.moves[reviewPly - 1] : null;
  // Disabled continuous glow RAF (caused green flashing on Android)
  // if (gK > 0 && lastMove && !glowRaf) glowRaf = requestAnimationFrame(() => { glowRaf = null; drawBoardCanvas(); });

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const r = ranks[row];
      const f = files[col];
      const sq = "abcdefgh"[f] + (r + 1);
      const piece = b[7 - r][f];
      const x = col * sqSize;
      const y = row * sqSize;
      const isDark = (r + f) % 2 === 1;

      ctx.fillStyle = isDark ? "#9b6e46" : "#f1e2bd";
      ctx.fillRect(x, y, sqSize, sqSize);

      if (lastMove && (lastMove.from === sq || lastMove.to === sq)) {
        const isTo = lastMove.to === sq;
        ctx.fillStyle = isTo ? "rgba(255, 210, 70, 0.38)" : "rgba(255, 210, 70, 0.22)";
        ctx.fillRect(x, y, sqSize, sqSize);
        ctx.strokeStyle = isTo ? "rgba(255, 196, 40, 0.65)" : "rgba(255, 196, 40, 0.35)";
        ctx.lineWidth = Math.max(1.5, sqSize * (isTo ? 0.04 : 0.025));
        const lw = ctx.lineWidth / 2;
        ctx.strokeRect(x + lw, y + lw, sqSize - 2 * lw, sqSize - 2 * lw);
      }

      if (selected === sq) {
        ctx.strokeStyle = "#e7c66b";
        ctx.lineWidth = Math.max(3, sqSize * 0.08);
        ctx.strokeRect(x + ctx.lineWidth/2, y + ctx.lineWidth/2, sqSize - ctx.lineWidth, sqSize - ctx.lineWidth);
      }

      if (piece && piece.type === "k" && piece.color === game.turn() && game.in_check()) {
        const grad = ctx.createRadialGradient(x + sqSize/2, y + sqSize/2, sqSize*0.1, x + sqSize/2, y + sqSize/2, sqSize*0.5);
        grad.addColorStop(0, "rgba(231, 76, 60, 0.85)");
        grad.addColorStop(1, "rgba(231, 76, 60, 0)");
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, sqSize, sqSize);
      }

      ctx.font = \`600 \${Math.floor(sqSize * 0.16)}px "DM Sans", sans-serif\`;
      ctx.fillStyle = isDark ? "rgba(234, 220, 194, 0.8)" : "rgba(41, 35, 27, 0.75)";
      if (col === 0) {
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(String(r + 1), x + sqSize * 0.06, y + sqSize * 0.05);
      }
      if (row === 7) {
        ctx.textAlign = "right";
        ctx.textBaseline = "bottom";
        ctx.fillText("abcdefgh"[f], x + sqSize * 0.94, y + sqSize * 0.95);
      }

      // Skip drawing the piece if it's currently animating from this square
      const isAnimatingFrom = animating && animating.from === sq;
      if (piece && !isAnimatingFrom) {
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.25)";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.drawImage(pieceSprite(piece.color, piece.type, Math.round(sqSize)), x, y, sqSize, sqSize);
        ctx.restore();
      }

      if (rvm && lastMove && lastMove.to === sq) {
        const B = BADGES[rvm.k], bx = x + sqSize * 0.8, by = y + sqSize * 0.2, br = sqSize * 0.19;
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = sqSize * 0.06;
        ctx.fillStyle = B.c; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
        ctx.shadowColor = "transparent"; ctx.lineWidth = Math.max(1.5, sqSize * 0.03); ctx.strokeStyle = "#fff"; ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = \`800 \${Math.floor(sqSize * 0.2)}px "DM Sans",sans-serif\`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(B.sym, bx, by + sqSize * 0.01);
        ctx.restore();
      }
      if (legal.some(m => m.to === sq)) {
        ctx.save();
        if (piece) {
          ctx.strokeStyle = "rgba(33, 77, 54, 0.72)";
          ctx.lineWidth = Math.max(3, sqSize * 0.08);
          ctx.beginPath();
          ctx.arc(x + sqSize / 2, y + sqSize / 2, sqSize * 0.42, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = "rgba(33, 77, 54, 0.68)";
          ctx.beginPath();
          ctx.arc(x + sqSize / 2, y + sqSize / 2, sqSize * 0.14, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }
  }

  if (hintArrow && isAdminUser()) {
    drawArrow(hintArrow.from, hintArrow.to);
  }

  // Animation drawing disabled to prevent green flash on Android
  // (piece moves instantly instead)
}

async function squareClick(sq){
  if(reviewMode || game.game_over() || engineBusy) return;
  if(game.turn() !== human) return;
  const p = game.get(sq);
  if(selected){
    const moves = game.moves({square:selected, verbose:true});
    const target = moves.find(m=>m.to===sq);
    if(target){
      let promotion="q";
      if(target.flags.includes("p")){
        const choice=prompt("Phong cấp thành: q (Hậu), r (Xe), b (Tượng), n (Mã)","q");
        promotion=["q","r","b","n"].includes((choice||"q").toLowerCase())?(choice||"q").toLowerCase():"q";
      }
      const movingPiece = game.get(selected);
      const moveRes = game.move({from:selected, to:sq, promotion});
      if (checkCustomRepetition()) {
        setTimeout(() => checkGameOver(null, "Hoà cờ (Lặp lại 3 lần)"), 50);
        return;
      }
      selected=null;
      hintArrow=null;
      // Sound + animation
      const isCapture = !!moveRes.captured;
      const isCheck = game.in_check();
      playSound(isCapture ? "capture" : (isCheck ? "check" : "move"));
      if (movingPiece) startMoveAnimation(moveRes.from, sq, movingPiece);
      // The animation is disabled for mobile stability, so redraw synchronously.
      render();
      if(isOnlineGame && roomId && fbReady) {
        await update(ref(db, \`rooms/\${roomId}\`), {
          fen: game.fen(),
          pgn: game.pgn(),
          movesCount: game.history().length,
          lastMove: moveRes.san,
          turn: game.turn(),
          remainingW: remaining.w,
          remainingB: remaining.b,
          updatedAt: serverTimestamp()
        });
      }
      if(game.game_over()){ checkGameOver(); return; }
      if(!isOnlineGame) {
        engineBusy = false;
        setTimeout(() => {
          if(!game.game_over() && game.turn() !== human) botMove();
        }, 0);
      }
      return;
    }
  }
  selected = p && p.color===human ? sq : null;
  render();
}

// --- Bot Địa ngục: dừng sớm khi nước đi đã "chín" ---
// Nếu nước tốt nhất không đổi qua 3 độ sâu liên tiếp và điểm gần như không dao động,
// việc nghĩ thêm hiếm khi đổi kết quả → dừng để đỡ chờ. Nước khó (nước đi/điểm còn đổi) vẫn dùng đủ trần.
// Hàm này giống hệt bản trong arena.html.
function shouldStopEarly(hist, elapsedMs, budgetMs){
  if(elapsedMs < Math.max(200, budgetMs * 0.25)) return false;
  if(hist.length < 3) return false;
  const last = hist.slice(-3);
  if(last[last.length - 1].d < 8) return false;
  if(!last.every(x => x.mv === last[0].mv)) return false;
  const cps = last.map(x => x.cp);
  return Math.max(...cps) - Math.min(...cps) <= 25;
}
function trackEarlyStop(line){
  const es = earlyStop;
  if(!es || es.sent) return;
  if(line.includes("lowerbound") || line.includes("upperbound")) return;
  const dm = line.match(/ depth (\\d+)/), sm = line.match(/score (cp|mate) (-?\\d+)/), pm = line.match(/ pv ([a-h][1-8][a-h][1-8][qrbn]?)/);
  if(!dm || !sm || !pm) return;
  const d = Number(dm[1]), v = Number(sm[2]);
  if(d <= es.lastDepth) return;                  // chỉ lấy dòng đầu của mỗi độ sâu
  es.lastDepth = d;
  es.hist.push({ d, mv: pm[1], cp: sm[1] === "mate" ? (v > 0 ? 1 : -1) * (100000 - Math.abs(v)) : v });
  if(shouldStopEarly(es.hist, performance.now() - es.t0, es.budget)){
    es.sent = true;
    engine.postMessage("stop");
  }
}

// --- Bot Địa ngục: phân bổ thời gian + gửi lịch sử nước đi ---
// Thời gian nghĩ của bot Địa ngục (ms). Hàm này giống hệt bản trong arena.html.
function hellThinkMs(baseMs, leftMs){
  const ply = game.history().length;
  let t = baseMs;
  if(game.moves().length === 1) return 120;       // chỉ có 1 nước hợp lệ → khỏi nghĩ
  if(ply < 10) t = Math.round(t * 0.5);           // khai cuộc: đi nhanh, dành giờ cho trung/tàn cuộc
  if(leftMs != null) t = Math.min(t, Math.max(250, leftMs / 30 - 200)); // không để bot hết giờ
  return Math.max(120, Math.round(t));
}

// Trước đây bot chỉ nhận FEN nên không biết lịch sử → không né/không tận dụng được lặp thế cờ.
// Gửi "startpos moves ..." để engine nhận biết lặp lại. Có kiểm tra khớp FEN, sai thì quay về FEN.
function botPositionCmd(){
  try {
    const hv = game.history({verbose:true});
    const rp = new Chess();
    for(const m of hv) rp.move({from:m.from, to:m.to, promotion:m.promotion});
    if(rp.fen() === game.fen()){
      return "position startpos" + (hv.length ? " moves " + hv.map(m => m.from + m.to + (m.promotion || "")).join(" ") : "");
    }
  } catch(e) {}
  return "position fen " + game.fen();
}

function getNonRepeatingBotMoves(){
  const legal = game.moves({verbose:true});
  const seen = positionHistory;
  const safe = [];
  for(const m of legal){
    try{
      const probe = new Chess(game.fen());
      probe.move({from:m.from, to:m.to, promotion:m.promotion || "q"});
      const key = probe.fen().split(" ").slice(0,4).join(" ");
      if(!seen.has(key)) safe.push(m);
    }catch(e){}
  }
  // Never make the engine think forever when every legal move revisits a position.
  return (safe.length ? safe : legal).map(m => m.from + m.to + (m.promotion || ""));
}

function botMove(){
  if(isOnlineGame || game.game_over() || game.turn()===human || engineBusy) return;
  if(engineReady && engine){
    const cfg = DIFFICULTY[mode] || DIFFICULTY.easy;
    const hell = mode === "hell";
    const think = hell
      ? hellThinkMs(cfg.movetime, clockSeconds ? remaining[game.turn()] * 1000 : null)
      : cfg.movetime;
    engineBusy = true;
    engineMode = "play";
    render();
    engine.postMessage(\`setoption name Skill Level value \${cfg.skill}\`);
    // Gửi đầy đủ lịch sử cho TẤT CẢ cấp độ để engine nhận diện lặp thế cờ.
    engine.postMessage(botPositionCmd());
    earlyStop = hell ? { t0: performance.now(), budget: think, hist: [], lastDepth: 0, sent: false } : null;
    const avoidMoves = getNonRepeatingBotMoves();
    const searchPrefix = avoidMoves.length ? \`searchmoves \${avoidMoves.join(" ")}\` : "";
    const goCmd = hell
      ? \`go \${searchPrefix} movetime \${think}\`.replace(/\\s+/g," ").trim()
      : \`go \${searchPrefix} depth \${cfg.depth} movetime \${cfg.movetime}\`.replace(/\\s+/g," ").trim();
    engine.postMessage(goCmd);
    // Watchdog ngắn hơn để không mắc kẹt khi Worker không trả bestmove.
    armBotWatch(hell ? Math.max(2200, think + 1100) : Math.max(1800, cfg.movetime + 1200));
    return;
  }
  fallbackMove();
}

function fallbackMove(){
  engineBusy = false;
  const moves=game.moves({verbose:true});
  if(!moves.length) return;
  let move=moves[Math.floor(Math.random()*moves.length)];
  if(mode==="hard"||mode==="hell"){
    const scored=moves.map(m=>({
      m,
      s:(m.captured?({p:1,n:3,b:3,r:5,q:9}[m.captured]||0):0)+(m.san.includes("+")?2:0)+(m.san.includes("#")?100:0)
    })).sort((a,b)=>b.s-a.s);
    move=scored[0].m;
  }
  game.move(move);
  if (checkCustomRepetition()) {
    checkGameOver(null, "Hoà cờ (Lặp lại 3 lần)");
    return;
  }
  render();
  checkGameOver();
}

// 7. KẾT THÚC VÁN ĐẤU: CẬP NHẬT ELO & GHI LỊCH SỬ TOÀN HỆ THỐNG
// ============================================================================
async function checkGameOver(timeoutWinnerColor = null, forceReason = null) {
  if(!game.game_over() && !timeoutWinnerColor && !forceReason) return false;
  if(matchRecorded) return true;
  matchRecorded = true;
  stopClock();
  playSound("end");

  let resultForHuman = "draw";
  let reason = "Hoà cờ";
  if(forceReason) {
    reason = forceReason;
    resultForHuman = "draw";
  } else if(timeoutWinnerColor) {
    resultForHuman = (timeoutWinnerColor === human) ? "win" : "loss";
    reason = "Hết thời gian";
  } else if(game.in_checkmate()) {
    const winnerColor = game.turn() === "w" ? "b" : "w";
    resultForHuman = (winnerColor === human) ? "win" : "loss";
    reason = "Chiếu hết";
  } else if(game.in_stalemate()) {
    reason = "Hoà cờ (Hết nước đi)";
  } else if(game.in_threefold_repetition()) {
    reason = "Hoà cờ (Lặp lại 3 lần)";
  } else if(game.insufficient_material()) {
    reason = "Hoà cờ (Không đủ quân chiếu hết)";
  }

  archiveFinishedGame(resultForHuman, reason);
  if(!fbReady || !user) {
    const label = resultForHuman === "win" ? "🎉 Bạn thắng!" : resultForHuman === "loss" ? "Bạn đã thua." : "🤝 Ván cờ hoà.";
    $("gameStatus").textContent = \`\${reason} · \${label} (Đăng nhập để lưu Elo)\`;
    return true;
  }

  try {
    const pRef = ref(db, \`users/\${user.uid}/profile\`);
    const snap = await get(pRef);
    const cur = snap.exists() ? snap.val() : { name: user.displayName || user.email, email: user.email, elo: 1000, games: 0, wins: 0, draws: 0, losses: 0 };
    const eloBefore = cur.elo ?? 1000;
    let delta = 0;
    let opponentName = "";
    let opponentType = "bot";
    let modeLabel = "";

    if(isOnlineGame && onlineRoomData) {
      opponentType = "human";
      modeLabel = "PvP Online";
      const oppUid = human === "w" ? onlineRoomData.guest : onlineRoomData.host;
      let oppElo = 1000;
      opponentName = "Đối thủ Online";

      if(oppUid) {
        const oppSnap = await get(ref(db, \`users/\${oppUid}/profile\`));
        if(oppSnap.exists()) {
          oppElo = oppSnap.val().elo ?? 1000;
          opponentName = oppSnap.val().name || oppSnap.val().email || "Đối thủ Online";
        }
      }
      const numScore = resultForHuman === "win" ? 1 : resultForHuman === "draw" ? 0.5 : 0;
      delta = calcPvpEloDelta(eloBefore, oppElo, numScore);
    } else {
      const botRule = BOT_ELO_TABLE[mode] || BOT_ELO_TABLE.easy;
      delta = botRule[resultForHuman];
      opponentName = botRule.label;
      modeLabel = \`Đấu máy · \${modeNames[mode]}\`;
    }

    const eloAfter = Math.max(100, eloBefore + delta);
    await update(pRef, {
      elo: eloAfter,
      games: (cur.games || 0) + 1,
      wins: (cur.wins || 0) + (resultForHuman === "win" ? 1 : 0),
      draws: (cur.draws || 0) + (resultForHuman === "draw" ? 1 : 0),
      losses: (cur.losses || 0) + (resultForHuman === "loss" ? 1 : 0),
      lastSeen: serverTimestamp()
    });

    await push(ref(db, "matchHistory"), {
      uid: user.uid,
      userName: cur.name || user.displayName || user.email,
      userEmail: cur.email || user.email || "",
      opponentType,
      opponentName,
      mode: isOnlineGame ? "online" : mode,
      modeLabel,
      result: resultForHuman,
      reason,
      eloBefore,
      eloDelta: delta,
      eloAfter,
      movesCount: game.history().length,
      timestamp: Date.now()
    });

    const signStr = delta > 0 ? \`+\${delta}\` : \`\${delta}\`;
    const resText = resultForHuman === "win" ? "🎉 Bạn thắng!" : resultForHuman === "loss" ? "Bạn thua!" : "🤝 Hoà cờ!";
    $("gameStatus").textContent = \`\${reason} · \${resText} (\${signStr} Elo → \${eloAfter})\`;
  } catch(err) {
    console.error("Lỗi cập nhật Elo:", err);
  }
  return true;
}

// 8. XEM LẠI TRẬN ĐẤU SAU KHI KẾT THÚC
// ============================================================================
const BADGES = {
  brilliant:{sym:"!!",c:"#1bbfd0",name:"Thiên tài"}, great:{sym:"!",c:"#5b8bd9",name:"Tuyệt vời"},
  best:{sym:"★",c:"#81b64c",name:"Tốt nhất"}, excellent:{sym:"✓",c:"#96bc4b",name:"Xuất sắc"},
  good:{sym:"•",c:"#a3a98c",name:"Tốt"}, inacc:{sym:"?!",c:"#f0b429",name:"Không chính xác"},
  mistake:{sym:"?",c:"#e58f2a",name:"Sai lầm"}, blunder:{sym:"??",c:"#ca3431",name:"Sai lầm nghiêm trọng"}
};
const winPct = cp => 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
const PV = {p:1,n:3,b:3,r:5,q:9,k:0};

function isSac(fenAfter, m){
  if(m.piece === "k" || m.piece === "p") return false;
  const g = new Chess(fenAfter);
  const caps = g.moves({verbose:true}).filter(x => x.to === m.to && x.captured).sort((a, b) => PV[a.piece] - PV[b.piece]);
  if(!caps.length) return false;
  const q = caps[0]; g.move(q);
  const recap = g.moves({verbose:true}).some(x => x.to === m.to && x.captured);
  const net = (m.captured ? PV[m.captured] : 0) - (PV[m.piece] - (recap ? PV[q.piece] : 0));
  return net <= -2;
}

function startReview(){
  if(reviewJob || reviewMode) return;
  if(!engineReady || !engine || engineBusy){ alert("Engine chưa sẵn sàng, thử lại sau giây lát."); return; }
  const hist = game.history({verbose:true});
  if(!hist.length) return;
  const g = new Chess(), fens = [g.fen()];
  hist.forEach(m => { g.move(m.san); fens.push(g.fen()); });
  reviewJob = { fens, hist, i:0, res:[], cur:{} };
  engineBusy = true;
  $("reviewModal").hidden = false; $("rvSummary").hidden = true; $("rvStart").hidden = true; $("rvProgress").hidden = false;
  engine.postMessage("ucinewgame");
  engine.postMessage("setoption name Skill Level value 20");
  engine.postMessage("setoption name MultiPV value 2");
  reviewNext();
}
function reviewNext(){
  const j = reviewJob;
  while(j.i < j.fens.length){
    const t = new Chess(j.fens[j.i]);
    if(!t.game_over()) break;
    j.res[j.i] = { s1: t.in_checkmate() ? -10000 : 0, s2: null, best: null }; j.i++;
  }
  $("rvFill").style.width = Math.round(j.i / j.fens.length * 100) + "%";
  $("rvPtxt").textContent = \`Đang phân tích \${j.i}/\${j.fens.length} vị trí…\`;
  if(j.i >= j.fens.length) return finishReview();
  j.cur = {};
  engine.postMessage("position fen " + j.fens[j.i]);
  engine.postMessage("go movetime 300");
}
function reviewLine(line){
  const j = reviewJob;
  if(line.startsWith("info ") && line.includes(" score ") && !/bound/.test(line)){
    const pv = Number((line.match(/multipv (\\d+)/) || [0, 1])[1]);
    const mt = line.match(/score mate (-?\\d+)/), cp = line.match(/score cp (-?\\d+)/);
    if(mt){ const v = Number(mt[1]); j.cur[pv] = v > 0 ? 10000 - v : -10000 - v; }
    else if(cp) j.cur[pv] = Number(cp[1]);
  } else if(line.startsWith("bestmove")){
    const b = line.split(" ")[1];
    j.res[j.i] = { s1: j.cur[1] ?? 0, s2: j.cur[2] ?? null, best: (b && b !== "(none)") ? b : null };
    j.i++; reviewNext();
  }
}
function stopReviewJob(){
  if(!reviewJob) return;
  reviewJob = null; engineBusy = false; swallowBest = true;
  if(engine){ engine.postMessage("stop"); engine.postMessage("setoption name MultiPV value 1"); }
}
function finishReview(){
  const j = reviewJob; reviewJob = null; engineBusy = false;
  engine.postMessage("setoption name MultiPV value 1");
  const evals = j.res.map((r, i) => j.fens[i].split(" ")[1] === "w" ? r.s1 : -r.s1);
  const moves = j.hist.map((m, idx) => {
    const a = j.res[idx], b = j.res[idx + 1];
    const wB = winPct(a.s1), wA = winPct(-b.s1), loss = Math.max(0, wB - wA);
    const uci = m.from + m.to + (m.promotion || "");
    let k = (loss <= 0.5 || uci === a.best) ? "best" : loss <= 2 ? "excellent" : loss <= 5 ? "good" : loss <= 10 ? "inacc" : loss <= 20 ? "mistake" : "blunder";
    if((k === "best" || k === "excellent") && wB < 90 && wA >= 45 && isSac(j.fens[idx + 1], m)) k = "brilliant";
    else if(k === "best" && a.s2 != null && wB - winPct(a.s2) >= 15) k = "great";
    let bestSan = null;
    if(a.best && uci !== a.best){ try { const r = new Chess(j.fens[idx]).move({from:a.best.slice(0,2), to:a.best.slice(2,4), promotion:a.best[4] || "q"}); bestSan = r ? r.san : null; } catch(e){} }
    return { side:m.color, san:m.san, k, bestSan, acc:Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * loss) - 3.1669)) };
  });
  reviewData = { moves, evals, hist:j.hist };
  const cnt = {w:{}, b:{}}, acc = {w:[], b:[]};
  moves.forEach(m => { cnt[m.side][m.k] = (cnt[m.side][m.k] || 0) + 1; acc[m.side].push(m.acc); });
  const avg = a => a.length ? (a.reduce((x, y) => x + y, 0) / a.length).toFixed(1) : "–";
  let h = \`<div class="rv-row rv-head"><span></span><b>Trắng</b><b>Đen</b></div><div class="rv-row"><span>Độ chính xác</span><b>\${avg(acc.w)}%</b><b>\${avg(acc.b)}%</b></div>\`;
  Object.keys(BADGES).forEach(k => { h += \`<div class="rv-row"><span><i class="rv-dot" style="background:\${BADGES[k].c}">\${BADGES[k].sym}</i>\${BADGES[k].name}</span><b>\${cnt.w[k] || 0}</b><b>\${cnt.b[k] || 0}</b></div>\`; });
  $("rvSummary").innerHTML = h;
  $("rvProgress").hidden = true; $("rvSummary").hidden = false; $("rvStart").hidden = false;
}
function enterReview(){ reviewFull = game; reviewMode = true; $("reviewBar").hidden = false; document.body.classList.add("reviewing"); gotoPly(0); }
function exitReview(){
  if(!reviewMode) return;
  reviewMode = false; game = reviewFull; reviewFull = null; selected = null;
  $("reviewBar").hidden = true; document.body.classList.remove("reviewing"); render();
}
function gotoPly(k){
  const d = reviewData, n = d.hist.length;
  reviewPly = Math.max(0, Math.min(n, k));
  game = new Chess();
  positionHistory = new Map();
  checkCustomRepetition(); // count initial position
  for(let i = 0; i < reviewPly; i++) game.move(d.hist[i].san);
  selected = null; hintArrow = null; render();
  const m = reviewPly > 0 ? d.moves[reviewPly - 1] : null, B = m && BADGES[m.k], ev = d.evals[reviewPly];
  $("rvBadge").hidden = !m;
  if(m){ $("rvBadge").textContent = B.sym; $("rvBadge").style.background = B.c; $("rvMove").textContent = \`\${Math.ceil(reviewPly / 2)}\${reviewPly % 2 ? "." : "…"} \${m.san}\`; $("rvName").textContent = B.name; $("rvName").style.color = B.c; }
  else { $("rvMove").textContent = "Vị trí xuất phát"; $("rvName").textContent = ""; }
  let sub = \`Đánh giá: \${Math.abs(ev) >= 9000 ? "Chiếu hết" : (ev > 0 ? "+" : "") + (ev / 100).toFixed(2)} · \${reviewPly}/\${n}\`;
  if(m && m.bestSan) sub += \` · Nước tốt hơn: \${m.bestSan}\`;
  $("rvSub").textContent = sub;
}

function startClock(){

  },1000);
}

        <p>Kỳ thủ <strong>\${escapeHtml(senderName)}</strong> (Elo \${senderElo}) vừa mời bạn vào bàn cờ trực tiếp.</p>
        <div style="display:flex;gap:8px">
          <button class="primary" style="flex:1;padding:8px 12px;font-size:13px" data-facc="1">⚔️ Chấp nhận vào bàn</button>
          <button class="ghost" style="padding:8px 12px;font-size:13px" data-fdec="1">Bỏ qua</button>
        </div>
      \`;
      card.querySelector("[data-facc]").onclick = () => acceptGameInvite(fromUid, inv);
      card.querySelector("[data-fdec]").onclick = () => declineGameInvite(fromUid);
      floatEl.append(card);
    });
  });
}

$("addFriendBtn").onclick=async()=>{
  if(!fbReady||!user){ $("authModal").classList.add("open"); return; }
  const target=$("friendId").value.trim();
  if(!target||target===user.uid){ $("friendStatus").textContent="UID không hợp lệ."; return; }
  try{
    const s=await get(ref(db,\`users/\${target}/profile\`));
    if(!s.exists()) throw Error("Không tìm thấy người chơi với UID này.");
    await set(ref(db,\`requests/\${target}/\${user.uid}\`),{
      from:user.uid,
      name:user.displayName||user.email.split("@")[0]||"",
      email:user.email||"",
      createdAt:serverTimestamp()
    });
    $("friendStatus").textContent="Đã gửi lời mời kết bạn thành công!";
  }catch(e){ $("friendStatus").textContent=e.message; }
};

function subscribeRoom(id, myColor) {
  if(roomUnsub) roomUnsub();
  isOnlineGame = true;
  matchRecorded = false;
  $("resignBtn").hidden = false;
  // Khởi động đồng hồ cho online (dùng thời gian đã chọn hoặc mặc định)
  if(!clockSeconds) clockSeconds = 600; // mặc định 10 phút nếu chưa chọn
  remaining = { w: clockSeconds, b: clockSeconds };
  startClock();
  human = myColor;
  flipped = human === "b";
  tab("game");
  $("gameTitle").textContent = \`Phòng Online: \${id}\`;
  $("bottomName").textContent = user ? (user.displayName || user.email) : "Bạn";
  roomUnsub = onValue(ref(db, \`rooms/\${id}\`), snap => {
    if(!snap.exists()) return;
    const data = snap.val();
    onlineRoomData = data;

    // Phát hiện đầu hàng từ đối thủ
    if(data.status === "resigned" && data.winner && !matchRecorded) {
      const winnerColor = data.winner;
      const resultForMe = (winnerColor === human) ? "win" : "loss";
      playSound("end");
      checkGameOver(winnerColor === human ? human : (human === "w" ? "b" : "w"), "Đối thủ đầu hàng");
      $("gameStatus").textContent = resultForMe === "win"
        ? "🎉 Đối thủ đầu hàng · Bạn thắng!"
        : "Bạn đã đầu hàng.";
      $("resignBtn").hidden = true;
      return;
    }

    // Đồng bộ thời gian từ phòng (nếu có)
    if(typeof data.remainingW === "number") remaining.w = data.remainingW;
    if(typeof data.remainingB === "number") remaining.b = data.remainingB;
    updateClock();

    if(data.pgn) {
      game.load_pgn(data.pgn);
      render();
      if(game.game_over()) checkGameOver();
    } else if(data.fen && data.fen !== game.fen()) {
      game.load(data.fen);
      render();
      if(game.game_over()) checkGameOver();
    }
    const oppName = myColor === "w" ? (data.guestName || (data.guest ? "Đối thủ Online" : "⏳ Đang chờ bạn bè vào...")) : (data.hostName || "Chủ phòng");
    $("topName").textContent = oppName;
  });
}

$("createRoomBtn").onclick=async()=>{
  if(!fbReady||!user){ $("authModal").classList.add("open"); alert("Đăng nhập để tạo phòng online."); return; }
  const r=push(ref(db,"rooms"));
  roomId=r.key;
  game = new Chess();
  positionHistory = new Map();
  checkCustomRepetition(); // count initial position
  await set(r,{
    host:user.uid,
    hostName:user.displayName||user.email,
    guest:null,
    guestName:null,
    status:"waiting",
    fen:game.fen(),
    pgn:"",
    turn:"w",
    createdAt:serverTimestamp()
  });
  $("roomCode").value=roomId;
  $("roomStatus").textContent="Đã tạo phòng! Hãy gửi mã phòng hoặc nhấn Mời đấu ở danh sách bạn bè.";
  subscribeRoom(roomId, "w");
};

$("joinRoomBtn").onclick=async()=>{
  if(!fbReady||!user){ $("authModal").classList.add("open"); alert("Đăng nhập để tham gia phòng."); return; }
  const id=$("roomCode").value.trim();
  if(!id) return;
  try{
    const r=ref(db,\`rooms/\${id}\`), s=await get(r);
    if(!s.exists()) throw Error("Không tìm thấy mã phòng này.");
    const val = s.val();
    if(val.guest && val.guest !== user.uid && val.host !== user.uid) throw Error("Phòng đã đủ 2 người.");
    if(val.host !== user.uid) {
      await update(r,{
        guest:user.uid,
        guestName:user.displayName||user.email,
        status:"playing",
        updatedAt:serverTimestamp()
      });
    }
    roomId=id;
    subscribeRoom(roomId, val.host === user.uid ? "w" : "b");
  }catch(e){ $("roomStatus").textContent=e.message; }
};

restoreCurrentGame();
renderUser();
render();
renderHistoryList();
<\/script>
